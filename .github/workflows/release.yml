name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Semantic versioning tags like v1.2.3

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --all-features --release --verbose

      - name: Run tests (release)
        run: cargo test --all-features --release --verbose

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp target/release/syntra_browse

      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: release/

      # Add steps for publishing to crates.io, GitHub Releases, Docker Hub, etc., as needed
