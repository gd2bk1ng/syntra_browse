# ================================================================================================
#   SYNTRA KERNEL — CONTINUOUS INTEGRATION PIPELINE
#   ------------------------------------------------------------------------------------------------
#        .\s/.
#       :: S ::
#        '/s\'
#
#   File:        .github/workflows/syntra-ci.yml
#   Module:      Syntra Kernel — CI Pipeline
#   Description: Unified CI workflow for backend (Rust), frontend (React/TS), and WASM builds.
#                Ensures code quality, security, formatting, linting, testing, and artifact
#                generation across the entire Syntra Kernel ecosystem.
#
#   Notes:
#     - Backend: Cortex, Conduit, Reasoner, Pipelines, Runtime.
#     - Frontend: Visualization dashboard + chat interface.
#     - WASM: Optional Phase 3+ modules.
# ================================================================================================

name: Syntra Kernel CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: syntra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================================
  # Backend: Rust (Syntra Kernel cognitive runtime)
  # ============================================================================================
  backend:
    name: Backend (Rust — Syntra Kernel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: syntra_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Security audit
      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run dependency security audit
        run: cargo audit

      # Formatting check
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Linting with Clippy
      - name: Run Clippy (Rust linter)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Build & Test
      - name: Build Syntra Kernel (release)
        run: cargo build --all-features --release --verbose

      - name: Run tests (release)
        run: cargo test --all-features --release --verbose

      # Coverage (optional)
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin || true

      - name: Run coverage
        run: cargo tarpaulin --out Xml
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: syntra-coverage-report
          path: tarpaulin-report.xml
          if-no-files-found: ignore

      # Benchmarks (non-blocking)
      - name: Run benchmarks
        run: cargo bench
        continue-on-error: true

      # Upload backend debug artifacts
      - name: Upload backend debug artifacts
        uses: actions/upload-artifact@v3
        with:
          name: syntra-backend-debug
          path: target/debug/
          if-no-files-found: ignore

  # ============================================================================================
  # Frontend: React/TypeScript (Syntra Visualization)
  # ============================================================================================
  frontend:
    name: Frontend (Syntra Visualization)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend lint
        run: npm run lint
        continue-on-error: true

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v3
        with:
          name: syntra-frontend-build
          path: frontend/dist/
          if-no-files-found: ignore

  # ============================================================================================
  # WASM Build (optional)
  # ============================================================================================
  wasm:
    name: WASM Build (Syntra Kernel — Optional)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM modules
        run: cargo build -p syntra_wasm --target wasm32-unknown-unknown --release
        continue-on-error: true

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: syntra-wasm
          path: target/wasm32-unknown-unknown/release/
          if-no-files-found: ignore

  # ============================================================================================
  # Meta Job: CI Status
  # ============================================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, wasm]

    steps:
      - name: All systems green
        run: echo "Syntra Kernel CI completed successfully."
