<!-- ============================================================================================
   SYNTRA KERNEL — HELIX ICON
   
        .\s/.
       :: S ::
        '/s\'

   File:        /assets/syntra_helix.svg
   Module:      Syntra Kernel — Visual Identity Asset
   Author:      Alexandr Roussinov (gd2bk1ng)
   Description: Official Syntra Kernel Helix icon — a circular badge featuring the stylized
                S‑helix motif. Used across dashboards, documentation, and visualization surfaces.

   Notes:
     - This icon represents the Syntra Kernel cognitive helix: perception → cognition → action.
     - Designed for scalability across UI, CLI, and documentation contexts.
     - Safe for embedding in React, Rust (via include_str!), or web dashboards.
   ============================================================================================ -->

<svg width="512" height="512" viewBox="0 0 512 512"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5A00FF"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="helix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#5A00FF"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <path d="
    M 160 140
    C 220 80, 320 80, 360 160
    C 390 220, 340 260, 280 280
    C 220 300, 180 320, 160 360
    C 140 400, 160 440, 200 460
  "
    fill="none"
    stroke="url(#helix)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
