[package]
name = "syntra_kernel"
version = "0.3.0"
edition = "2024"
authors = [ "Alexandr Roussinov <gd2bk1ng@proton.me>" ]
license = "MIT"
description = "Syntra Kernel - A world‑model‑driven cognitive OS for intent‑driven systems, featuring multi‑agent cognition, semantic memory, simulation, and adaptive reasoning."
readme = "README.md"
repository = "https://github.com/gd2bk1ng/syntra_kernel/"
homepage = "https://github.com/gd2bk1ng/syntra_kernel/"
keywords = [ "syntra", "ai", "agi", "rust", "world-model", "intent-engine", "multi-agent", "cognitive-architecture" ]
categories = [ "gui", "ai", "wasm", "data-structures", "simulation" ]
publish = false

# ================================================================================================
# Library Target — exposes the Syntra API for internal and future multi-crate use
# ================================================================================================
[lib]
name = "syntra_kernel"
path = "src/lib.rs"

# ================================================================================================
# Binary Targets — main runtime + experimental sandbox + compiler demo
# ================================================================================================
[[bin]]
name = "syntra_kernel"
path = "src/main.rs"

[[bin]]
name = "syntra_trials"
path = "trials/main.rs"

[[bin]]
name = "syntra_compiler_demo"
path = "src/bin/syntra_compiler_demo.rs"

# ================================================================================================
# Dependencies — core engine, rendering, AGI, networking, diagnostics
# ================================================================================================
[dependencies]
winit = "0.29"
pixels = "0.13"
winit_input_helper = "0.14"

ring = "0.16"
data-encoding = "2.3"

chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "stream"] }

serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = "0.8"

anyhow = "1.0"
thiserror = "1.0"

glam = "0.27"
config = "0.14"
colored = "2.1"

tracing = "0.1"
tracing-subscriber = "0.3"

libloading = "0.8"

# ================================================================================================
# Dev Dependencies — testing, assertions, diagnostics
# ================================================================================================
[dev-dependencies]
pretty_assertions = "1.4"

# ================================================================================================
# Optional Features — AGI expansion, WASM future support
# ================================================================================================
[features]
default = []
agi = ["serde", "serde_json"]
wasm = []

# ================================================================================================
# Build Profiles — tuned for serious development & production
# ================================================================================================
[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# ================================================================================================
# Workspace — future multi-crate expansion (Syntra Core, Renderer, Plugins)
# ================================================================================================
[workspace]
members = [
    ".",                 # main crate
    # "syntra_core",
    # "syntra_renderer",
    # "syntra_plugins",
]

# ================================================================================================
# Lints — enforce high-quality Rust across the entire codebase
# ================================================================================================
[lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
