[package]
name = "syntra_browse"
version = "0.1.0"
edition = "2024"
authors = ["Alexandr Roussinov <gd2bk1ng@proton.me>"]
license = "MIT"
description = "Syntra Browser — Axiom Zero: An AGI-driven intent browser."
readme = "README.md"
repository = "https://github.com/gd2bk1ng/syntra_browse"
homepage = "https://github.com/gd2bk1ng/syntra_browse"
keywords = ["agi", "browser", "intent-engine", "syntra", "rendering"]
categories = ["gui", "graphics", "ai", "wasm"]
publish = false

# ------------------------------------------------------------------------------
# Library Target — enables syntra_browse to expose a reusable library API
# ------------------------------------------------------------------------------

[lib]
name = "syntra"
path = "src/lib.rs"

# Optional: If you want to support WASM later
# default-run = "syntra_browse"

# ------------------------------------------------------------------------------
# Dependencies
# ------------------------------------------------------------------------------

[dependencies]
winit = "0.29"
pixels = "0.13"
winit_input_helper = "0.14"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
glam = "0.27"
config = "0.14"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
libloading = "0.8"

[dev-dependencies]
pretty_assertions = "1.4"

# ------------------------------------------------------------------------------
# Build Profiles — tuned for serious development & production
# ------------------------------------------------------------------------------

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# ------------------------------------------------------------------------------
# Workspace — future multi-crate expansion
# ------------------------------------------------------------------------------

[workspace]
members = [
    ".",                 # main crate
    # "syntra_core",
    # "syntra_renderer",
    # "syntra_plugins",
]

# ------------------------------------------------------------------------------
# Lints — enforce high-quality Rust
# ------------------------------------------------------------------------------

[lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
